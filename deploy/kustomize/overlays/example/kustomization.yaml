apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Example overlay. Copy this directory per environment and adjust namespace,
# the image tag, and any patches (ingress host, replicas, env values).
namespace: alitellm-auth

resources:
  - ../../base

# Pin the runtime image tag. Bumped by `make release-bump VERSION=X.Y.Z`.
images:
  - name: ghcr.io/ackstorm/alitellm-auth
    newTag: v0.4.4
