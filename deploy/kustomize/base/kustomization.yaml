apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Plain-manifest base. The example overlay stamps namespace + the pinned image tag.
# secret.example.yaml is reference-only and intentionally NOT a resource here —
# create the real Secret out-of-band.
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
