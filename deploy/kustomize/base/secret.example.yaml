# Reference only — NOT included in kustomization.yaml resources.
# Create the real secret out-of-band:
#
#   kubectl create secret generic alitellm-auth-secret -n <namespace> \
#     --from-literal=SESSION_SECRET_KEY=$(openssl rand -hex 32) \
#     --from-literal=OAUTH_CLIENT_SECRET=<value-of-GENAI_OAUTH_MCP_SECRET-in-dex> \
#     --from-literal=LITELLM_MASTER_KEY=sk-admin-...
#
# DO NOT commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: alitellm-auth-secret
type: Opaque
stringData:
  # Shared across all replicas — run: openssl rand -hex 32
  SESSION_SECRET_KEY: "change-me"
  # OIDC client secret — matches ${GENAI_OAUTH_MCP_SECRET} in Dex, or Keycloak client credentials
  OAUTH_CLIENT_SECRET: "change-me"
  # LiteLLM master key (used to call /team/new, /user/new, /key/generate)
  LITELLM_MASTER_KEY: "sk-admin-change-me"
