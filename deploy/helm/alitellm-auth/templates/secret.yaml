{{- if and .Values.secret.create (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alitellm-auth.secretName" . }}
  labels:
    {{- include "alitellm-auth.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_SECRET_KEY: {{ required "secret.sessionSecretKey is required when secret.create=true" .Values.secret.sessionSecretKey | quote }}
  OAUTH_CLIENT_SECRET: {{ required "secret.oauthClientSecret is required when secret.create=true" .Values.secret.oauthClientSecret | quote }}
  LITELLM_MASTER_KEY: {{ required "secret.litellmMasterKey is required when secret.create=true" .Values.secret.litellmMasterKey | quote }}
{{- end }}
