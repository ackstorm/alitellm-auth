{{- if .Values.authz.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alitellm-auth.fullname" . }}-authz
  labels:
    {{- include "alitellm-auth.labels" . | nindent 4 }}
    app.kubernetes.io/component: authz
spec:
  replicas: {{ .Values.authz.replicaCount }}
  selector:
    matchLabels:
      {{- include "alitellm-auth.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: authz
  template:
    metadata:
      labels:
        {{- include "alitellm-auth.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: authz
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "alitellm-auth.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: authz
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: authz
          image: "{{ .Values.authz.image.repo }}:{{ .Values.authz.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.authz.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: grpc
              containerPort: 9001
          env:
            - name: AUTHZ_INBOUND_HEADER
              value: {{ .Values.authz.inboundHeader | quote }}
            - name: AUTHZ_OUTBOUND_HEADER
              value: {{ .Values.authz.outboundHeader | quote }}
            - name: AUTHZ_ISSUER
              value: {{ .Values.authz.issuer | default .Values.authServer.issuerUrl | default .Values.config.appBaseUrl | quote }}
            - name: AUTHZ_AUDIENCE
              value: {{ .Values.authz.audience | default .Values.authServer.audience | quote }}
            - name: AUTHZ_RESOURCE_METADATA_URL
              value: {{ .Values.authz.resourceMetadataUrl | default (printf "%s/.well-known/oauth-protected-resource" (.Values.config.apiPublicUrl | trimSuffix "/")) | quote }}
            - name: AUTHZ_KEY_RESOLVER_URL
              value: {{ printf "http://%s:%d/api/internal/front-key" (include "alitellm-auth.fullname" .) (int .Values.service.port) | quote }}
            - name: AUTHZ_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "alitellm-auth.secretName" . }}
                  key: INTERNAL_TOKEN
            - name: AUTHZ_KEY_CACHE_TTL_SECONDS
              value: {{ .Values.authz.keyCacheTtlSeconds | quote }}
          readinessProbe:
            grpc:
              port: 9001
          livenessProbe:
            grpc:
              port: 9001
          resources:
            {{- toYaml .Values.authz.resources | nindent 12 }}
{{- end }}
