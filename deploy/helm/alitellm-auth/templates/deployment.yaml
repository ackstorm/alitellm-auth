apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alitellm-auth.fullname" . }}
  labels:
    {{- include "alitellm-auth.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "alitellm-auth.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "alitellm-auth.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "alitellm-auth.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repo }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ include "alitellm-auth.secretName" . }}
          env:
            - name: APP_BASE_URL
              value: {{ .Values.config.appBaseUrl | quote }}
            - name: OAUTH_ISSUER_URL
              value: {{ .Values.config.oauthIssuerUrl | quote }}
            - name: OAUTH_CLIENT_ID
              value: {{ .Values.config.oauthClientId | quote }}
            - name: LITELLM_URL
              value: {{ .Values.config.litellmUrl | quote }}
            - name: LITELLM_DEFAULT_TEAM
              value: {{ .Values.config.litellmDefaultTeam | quote }}
            - name: API_PUBLIC_URL
              value: {{ .Values.config.apiPublicUrl | quote }}
            - name: CHAT_PUBLIC_URL
              value: {{ .Values.config.chatPublicUrl | quote }}
            # D-18: Secure cookie flag. True in prod (HTTPS), False for local HTTP dev.
            - name: SESSION_HTTPS_ONLY
              value: {{ .Values.config.sessionHttpsOnly | quote }}
            {{- with .Values.openwork }}
            {{- if .enabled }}
            - name: OPENWORK_ENABLED
              value: "true"
            - name: OPENWORK_BRAND_APP_NAME
              value: {{ .brandAppName | quote }}
            - name: OPENWORK_BRAND_LOGO_URL
              value: {{ .brandLogoUrl | default (printf "%s/openwork/brand/logo.svg" $.Values.config.appBaseUrl) | quote }}
            - name: OPENWORK_BRAND_ICON_URL
              value: {{ .brandIconUrl | default (printf "%s/openwork/brand/icon.svg" $.Values.config.appBaseUrl) | quote }}
            - name: OPENWORK_ACCENT_COLOR
              value: {{ .accentColor | quote }}
            - name: OPENWORK_BLOCKED_COMMANDS
              value: {{ .blockedCommands | toJson | quote }}
            - name: OPENWORK_BLOCK_BROWSER_UPLOADS
              value: {{ .blockBrowserUploads | quote }}
            - name: OPENWORK_ORG_NAME
              value: {{ .orgName | quote }}
            - name: OPENWORK_ORG_SLUG
              value: {{ .orgSlug | quote }}
            - name: OPENWORK_TOKEN_TTL_SECONDS
              value: {{ .tokenTtlSeconds | int | quote }}
            - name: OPENWORK_GRANT_TTL_SECONDS
              value: {{ .grantTtlSeconds | int | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.factoryConfig.enabled }}
            - name: FACTORY_CONFIG_PATH
              value: {{ printf "%s/factory-config.json" .Values.factoryConfig.mountPath | quote }}
            {{- end }}
          {{- if or .Values.factoryConfig.enabled .Values.publicArtifacts.enabled }}
          volumeMounts:
            {{- if .Values.factoryConfig.enabled }}
            - name: factory-config
              mountPath: {{ .Values.factoryConfig.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.publicArtifacts.enabled }}
            # NO subPath: a subPath mount is resolved once at container start
            # and never sees a ConfigMap update, so the artifacts would freeze
            # at boot forever with no error anywhere. Mounting the directory
            # lets the kubelet sync changes in place (~60s).
            - name: public-artifacts
              mountPath: {{ .Values.publicArtifacts.mountPath }}
              readOnly: true
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.factoryConfig.enabled .Values.publicArtifacts.enabled }}
      volumes:
        {{- if .Values.factoryConfig.enabled }}
        - name: factory-config
          configMap:
            name: {{ include "alitellm-auth.fullname" . }}-factory-config
            optional: true
        {{- end }}
        {{- if .Values.publicArtifacts.enabled }}
        # projected, not a plain configMap volume: a configMap volume owns the
        # whole directory, so a second artifact could never be added alongside
        # the first. Each source places its key at its own sub-path.
        - name: public-artifacts
          projected:
            sources:
            {{- range .Values.publicArtifacts.sources }}
              - configMap:
                  name: {{ .name }}
                  # optional: the producer may not have written it yet, and a
                  # missing artifact must not block the pod from starting.
                  optional: true
                  items:
                    - key: {{ .key }}
                      path: {{ .path }}
            {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
