# deploy/helm/alitellm-auth/values.yaml
#
# Parameterized surfaces for the alitellm-auth chart. Defaults reproduce the
# legacy k8s/ manifests so an unparameterized `helm install` renders the same
# deployment that `kubectl apply -f k8s/` used to.

replicaCount: 1

image:
  repo: ghcr.io/ackstorm/alitellm-auth
  # Tag to deploy. Bumped by `make release-bump VERSION=X.Y.Z`. Leave empty to
  # fall back to .Chart.AppVersion.
  tag: "v0.8.4"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Non-secret application config -> plain env vars on the container.
# These map 1:1 to src/api/app/config.py Settings fields.
config:
  appBaseUrl: "https://platform.ackstorm.ai"
  oauthIssuerUrl: "https://dex.ackstorm.ai/dex"
  oauthClientId: "platform"
  litellmUrl: "https://litellm.ackstorm.ai"
  # Shared LiteLLM team id + display name (one team per deployment). Decoupled
  # from oauthClientId so the team can be renamed independently.
  litellmDefaultTeam: "default"
  apiPublicUrl: "https://api.ackstorm.ai"
  # Hosted chat UI URL (CHAT nav button + How-to card). Leave empty to derive
  # chat.<domain> from apiPublicUrl's host; set it when chat lives elsewhere.
  chatPublicUrl: "https://chat.ackstorm.ai"
  # D-18: Secure cookie flag. True in prod (HTTPS), False for local HTTP dev.
  sessionHttpsOnly: "true"

# Sensitive config (SESSION_SECRET_KEY, OAUTH_CLIENT_SECRET, LITELLM_MASTER_KEY).
# Recommended: pre-create a Secret and reference it here. The chart injects all
# of its keys into the container via envFrom.secretRef.
existingSecret: "alitellm-auth-secret"

# Escape hatch: render the Secret FROM these values instead of using an existing
# one. Discouraged for production (values are stored in the Helm release). Only
# used when existingSecret is "" AND secret.create is true.
secret:
  create: false
  sessionSecretKey: ""
  oauthClientSecret: ""
  litellmMasterKey: ""

# Factory config: a ConfigMap JSON mounted at FACTORY_CONFIG_PATH that drives the
# default team/user LiteLLM params applied on virtual-key creation.
factoryConfig:
  enabled: true
  mountPath: /etc/alitellm-auth
  config:
    # Team budget is a SHARED pool: max_budget caps the combined spend of all
    # users in the team, not per-user. Spread into POST /team/new.
    team:
      rpm_limit: 100
      tpm_limit: 1000000
      max_budget: 200
      budget_duration: "30d"
      metadata:
        rpm_limit_type: best_effort_throughput
        tpm_limit_type: best_effort_throughput
    user:
      rpm_limit: 100
      tpm_limit: 1000000
      max_budget: 100
      budget_duration: "30d"
      metadata:
        rpm_limit_type: best_effort_throughput
        tpm_limit_type: best_effort_throughput

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # Remove if cert-manager is not installed.
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: platform.ackstorm.ai
  tls:
    enabled: true
    secretName: platform-tls

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# publicArtifacts: mount externally-generated static files and serve them
# unauthenticated at /public/<path>. Today: the OpenCode model catalog that
# alitellm-operator renders from LiteLLMModelAlias CRs, reachable at
# /public/opencode/api.json.
#
# Anything mounted here is world-readable — the /public StaticFiles mount
# carries no auth dependency. Mount ONLY non-secret artifacts.
#
# Updates arrive without a pod restart: the kubelet syncs a mounted ConfigMap
# in place (~60s) and StaticFiles opens the file per request. No reloader
# needed. Do not add subPath to the mount or that stops being true.
publicArtifacts:
  enabled: false
  # Must match the StaticFiles directory in app.main, relative to WORKDIR /app.
  mountPath: /app/public
  sources:
    - name: opencode-catalog
      key: api.json
      path: opencode/api.json

# ── OAuth front door (docs/plans/2026-09-17-oauth-front-door.md) ─────────────
# The API's authorization server. Needs AS_SIGNING_KEY_PEM,
# AS_KEY_ENCRYPTION_KEY, AS_REDIS_URL and INTERNAL_TOKEN in the existingSecret.
authServer:
  enabled: false
  issuerUrl: ""          # empty → config.appBaseUrl
  audience: "alitellm"
  accessTtlSeconds: 3600
  refreshTtlSeconds: 604800   # 7 d; a refresh re-checks the user in LiteLLM
  # MCP services a user token may carry as scopes; scope = the /mcp/ path segment.
  services: {}
  #  mcp-aws-eks-ro: { store: aws-eks-ro, broker: https://api.ackstorm.ai/aws-eks-ro-callback }
  #  mcp-google-drive: { store: google-drive, broker: https://api.ackstorm.ai/google-drive-callback }
  mcpRedisUrl: ""   # the pods' Redis (grant projection); empty → AS_REDIS_URL

# ── OpenWork organization server (docs/plans/2026-09-18-openwork-den.md) ────
# Serves the OpenWork desktop's Den contract at <appBaseUrl>/openwork: SSO
# sign-in, enforced desktop policy, ACKstorm branding. Grants/tokens live in
# the AS store, so AS_REDIS_URL must be in the existingSecret (as for authServer).
openwork:
  enabled: false
  brandAppName: "ACKstorm Work"
  # Empty → <appBaseUrl>/openwork/brand/{logo,icon}.svg (served by the image).
  brandLogoUrl: ""
  brandIconUrl: ""
  accentColor: "mint"   # one of the 22 Radix families; anything else is dropped by the client
  # Case-insensitive globs over the whole command. NON-EMPTY DISABLES INTERACTIVE
  # TERMINALS AND SAVED COMMANDS in the desktop (managed-policy-rules.ts:77-78).
  blockedCommands: []
  blockBrowserUploads: false
  orgName: "ACKstorm"
  orgSlug: "ackstorm"
  tokenTtlSeconds: 2592000   # 30 d desktop session
  grantTtlSeconds: 300       # one-time sign-in link

# The Envoy ext_authz service Istio calls per request. failOpen is false in the
# provider, so this is a hard dependency of the whole API: two replicas, spread,
# and a PDB are not optional.
authz:
  enabled: false
  image:
    repo: ghcr.io/ackstorm/alitellm-authz
    tag: ""              # empty → .Chart.AppVersion
    pullPolicy: IfNotPresent
  replicaCount: 2
  inboundHeader: "x-genai-api-key"    # what agents send
  outboundHeader: "x-litellm-api-key" # what LiteLLM wants
  legacyPassthrough: true             # accept LiteLLM key during transition
  issuer: ""           # empty → authServer.issuerUrl or config.appBaseUrl
  audience: ""         # empty → authServer.audience
  # The base; the authz appends /mcp/<svc> for MCP paths. Served by this API
  # on api.* through a gitops route prefix.
  resourceMetadataUrl: ""  # empty → <config.apiPublicUrl>/.well-known/oauth-protected-resource
  keyCacheTtlSeconds: 300
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 64Mi }
  pdb:
    minAvailable: 1

# Istio wiring. The meshConfig extensionProvider is cluster-scoped and lives in
# gitops; see the runbook in the plan.
istio:
  enabled: false
  providerName: "alitellm-authz"
  # The Gateway the LiteLLM HTTPRoute attaches to.
  gateway:
    name: ""
    namespace: ""
  host: "api.ackstorm.ai"
  # Paths that must stay anonymous; RFC 9728 documents are fetched before a
  # client holds a token. MCP callbacks use separate HTTPRoutes.
  exemptPaths:
    - "/health"
    - "/.well-known/*"
