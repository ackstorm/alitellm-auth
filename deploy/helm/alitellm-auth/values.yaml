# deploy/helm/alitellm-auth/values.yaml
#
# Parameterized surfaces for the alitellm-auth chart. Defaults reproduce the
# legacy k8s/ manifests so an unparameterized `helm install` renders the same
# deployment that `kubectl apply -f k8s/` used to.

replicaCount: 1

image:
  repo: ghcr.io/ackstorm/alitellm-auth
  # Tag to deploy. Bumped by `make release-bump VERSION=X.Y.Z`. Leave empty to
  # fall back to .Chart.AppVersion.
  tag: "v0.18.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Non-secret application config -> plain env vars on the container.
# These map 1:1 to src/api/app/config.py Settings fields.
config:
  appBaseUrl: "https://platform.ackstorm.ai"
  oauthIssuerUrl: "https://dex.ackstorm.ai/dex"
  oauthClientId: "platform"
  # Scopes requested from the OIDC provider. Leave empty to use the app default
  # ("openid email profile"). Set "openid email profile groups" to have Dex
  # return the user's Workspace groups — this requires domain-wide delegation
  # for admin.directory.group.readonly on the Google connector's service
  # account. WITHOUT that delegation Dex fails the login outright, and this is
  # the only sign-in path, so enable it on a deployment you can watch and roll
  # back by clearing this value (env-only, no image rebuild).
  oauthScopes: ""
  litellmUrl: "https://litellm.ackstorm.ai"
  # Shared LiteLLM team id + display name (one team per deployment). Decoupled
  # from oauthClientId so the team can be renamed independently.
  # Ignored once personalTeamsEnabled is true — keys then land in the caller's
  # own team instead of this one.
  litellmDefaultTeam: "default"
  # ── Personal teams ────────────────────────────────────────────────────────
  # One LiteLLM team per user (id "<personalTeamPrefix><email>") instead of the
  # single shared team. A personal team has exactly one member, so the team
  # budget IS the per-user cap — and team budgets enforce where user-level ones
  # only report. The team is created permanently deny-all; the only thing that
  # opens it up is the access groups below.
  #
  # OFF by default on purpose: flipping it changes WHICH team a new key lives
  # in, and a team is what decides which models a client can reach. Enable it
  # on a deployment you can watch.
  personalTeamsEnabled: "false"
  # Prefix for the personal team id. Empty → the app default ("user-"). Kept
  # empty so there is one default, in config.py, not two that can drift.
  personalTeamPrefix: ""
  # Unified access-group NAMES attached to every personal team.
  #
  # EMPTY MEANS EVERY USER GETS A BUDGETED BUT COMPLETELY CLOSED TEAM — no
  # model is reachable. That is deliberate: a deny-all team fails loudly on the
  # first request, where a default-open one would silently over-grant and
  # nobody would notice.
  #
  # RENDERED AS JSON (`toJson`), not as a bare string: these are complex-typed
  # pydantic-settings fields, and pydantic parses those from the environment as
  # JSON. `DEFAULT_ACCESS_GROUPS=team-default` does not fall back to a string —
  # it raises SettingsError at startup and the pod crashloops.
  defaultAccessGroups: []
  # email -> EXTRA access-group names, on top of defaultAccessGroups. Keys are
  # case-folded at load and duplicates are rejected. Same JSON rule as above.
  # Kept in the environment (not the factory ConfigMap) because config.py reads
  # it as a plain Settings field; see the note on factoryConfig below.
  userAccessGroups: {}
  #  alice@example.com: ["team-research"]
  apiPublicUrl: "https://api.ackstorm.ai"
  # Hosted chat UI URL (CHAT nav button + How-to card). Leave empty to derive
  # chat.<domain> from apiPublicUrl's host; set it when chat lives elsewhere.
  chatPublicUrl: "https://chat.ackstorm.ai"
  # D-18: Secure cookie flag. True in prod (HTTPS), False for local HTTP dev.
  sessionHttpsOnly: "true"

# Sensitive config (SESSION_SECRET_KEY, OAUTH_CLIENT_SECRET, LITELLM_MASTER_KEY).
# Recommended: pre-create a Secret and reference it here. The chart injects all
# of its keys into the container via envFrom.secretRef.
existingSecret: "alitellm-auth-secret"

# Escape hatch: render the Secret FROM these values instead of using an existing
# one. Discouraged for production (values are stored in the Helm release). Only
# used when existingSecret is "" AND secret.create is true.
secret:
  create: false
  sessionSecretKey: ""
  oauthClientSecret: ""
  litellmMasterKey: ""

# Factory config: a ConfigMap JSON mounted at FACTORY_CONFIG_PATH that drives the
# default user LiteLLM params applied on virtual-key creation. Only whole-
# deployment defaults belong here; anything keyed per user (userAccessGroups)
# stays in config above, because config.py reads it from the environment.
#
# The old `team:` block is GONE, not commented out. A personal team has one
# member, so the `user` envelope below is what gets written onto it and a
# separate shared-pool team budget has nothing left to cap.
#
# DO NOT leave a commented-out `team:` stub here or in a gitops values file. A
# key whose children are all commented parses as null, and null OVERRIDES the
# chart default rather than leaving it alone — that is how the 200/30d block
# got silently erased in gitops. Delete the key, do not comment it.
factoryConfig:
  enabled: true
  mountPath: /etc/alitellm-auth
  config:
    # The per-user envelope. With personalTeamsEnabled this is written onto the
    # user's own team, where max_budget actually enforces (a user-level
    # max_budget only reports for team-scoped keys).
    user:
      rpm_limit: 100
      tpm_limit: 1000000
      max_budget: 100
      budget_duration: "30d"
      metadata:
        rpm_limit_type: best_effort_throughput
        tpm_limit_type: best_effort_throughput

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # Remove if cert-manager is not installed.
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: platform.ackstorm.ai
  tls:
    enabled: true
    secretName: platform-tls

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# publicArtifacts: mount externally-generated static files and serve them
# unauthenticated at /public/<path>. Today: the OpenCode model catalog that
# alitellm-operator renders from LiteLLMModelAlias CRs, reachable at
# /public/opencode/api.json.
#
# Anything mounted here is world-readable — the /public StaticFiles mount
# carries no auth dependency. Mount ONLY non-secret artifacts.
#
# Updates arrive without a pod restart: the kubelet syncs a mounted ConfigMap
# in place (~60s) and StaticFiles opens the file per request. No reloader
# needed. Do not add subPath to the mount or that stops being true.
publicArtifacts:
  enabled: false
  # Must match the StaticFiles directory in app.main, relative to WORKDIR /app.
  mountPath: /app/public
  sources:
    - name: opencode-catalog
      key: api.json
      path: opencode/api.json

# ── OAuth front door (docs/plans/2026-09-17-oauth-front-door.md) ─────────────
# The API's authorization server. ALWAYS ON — the console resolves each user's
# LiteLLM key out of its store, so the pod will not start without
# AS_SIGNING_KEY_PEM, AS_KEY_ENCRYPTION_KEY, AS_REDIS_URL and INTERNAL_TOKEN in
# the existingSecret.
authServer:
  issuerUrl: ""          # empty → config.appBaseUrl
  audience: "alitellm"
  accessTtlSeconds: 3600
  refreshTtlSeconds: 604800   # 7 d; a refresh re-checks the user in LiteLLM
  # MCP services a user token may carry as scopes; scope = the /mcp/ path segment.
  services: {}
  #  mcp-aws-eks-ro: { store: aws-eks-ro, broker: https://api.ackstorm.ai/aws-eks-ro-callback }
  #  mcp-google-drive: { store: google-drive, broker: https://api.ackstorm.ai/google-drive-callback }
  mcpRedisUrl: ""   # the pods' Redis (grant projection); empty → AS_REDIS_URL

# ── OpenWork organization server (docs/plans/2026-09-18-openwork-den.md) ────
# Serves the OpenWork desktop's Den contract at <appBaseUrl>/openwork: SSO
# sign-in, enforced desktop policy, the deployment's branding. Grants/tokens live in
# the AS store, so AS_REDIS_URL must be in the existingSecret (as for authServer).
openwork:
  enabled: false
  brandAppName: "AliteLLM Auth"
  # Empty → <appBaseUrl>/openwork/brand/{logo,icon}.svg (served by the image).
  brandLogoUrl: ""
  brandIconUrl: ""
  accentColor: "mint"   # one of the 22 Radix families; anything else is dropped by the client
  # Case-insensitive globs over the whole command. NON-EMPTY DISABLES INTERACTIVE
  # TERMINALS AND SAVED COMMANDS in the desktop (managed-policy-rules.ts:77-78).
  blockedCommands: []
  blockBrowserUploads: false
  orgName: "AliteLLM Auth"
  orgSlug: "alitellm-auth"
  tokenTtlSeconds: 2592000   # 30 d desktop session
  grantTtlSeconds: 300       # one-time sign-in link

# The Envoy ext_authz service Istio calls per request. failOpen is false in the
# provider, so this is a hard dependency of the whole API: two replicas, spread,
# and a PDB are not optional.
authz:
  enabled: false
  image:
    repo: ghcr.io/ackstorm/alitellm-authz
    tag: ""              # empty → .Chart.AppVersion
    pullPolicy: IfNotPresent
  replicaCount: 2
  # Headers an agent may present its credential in, in precedence order. The
  # value shape decides what happens (sk- renamed into outboundHeader, this AS's
  # token verified and mapped); no per-header mode. Every name here must ALSO be
  # in the gitops extensionProvider's includeRequestHeadersInCheck (see
  # templates/istio-authorizationpolicy.yaml) or Envoy never hands it to authz.
  inboundHeaders: ["x-genai-api-key", "x-api-key"]
  outboundHeader: "x-litellm-api-key" # what LiteLLM wants
  # Only /v1, /gemini, /mcp and /a2a require a credential. Every other path on
  # the host (LiteLLM's UI, /health/*, /key/*) is forwarded as it came when
  # nothing is presented; a presented credential is resolved everywhere.
  # Authorization is consumed only when it carries this AS's own token.
  issuer: ""           # empty → authServer.issuerUrl or config.appBaseUrl
  audience: ""         # empty → authServer.audience
  # A second trusted issuer: the identity provider behind the front door. Set it
  # when a browser app that has already signed the user in forwards its OIDC
  # access token instead of holding a key (LibreChat's custom endpoint does).
  # Empty leaves only the front door trusted, which is the default.
  #
  # idpAudience is mandatory once idpIssuer is set — it is the client the token
  # was minted for, and without it any token from that IdP, for any client,
  # would be accepted. idpSubjectClaim names the claim carrying the user's
  # email: Dex's `sub` is an opaque (userID, connectorID) pair the key resolver
  # cannot use, and Dex offers no way to change that.
  idpIssuer: ""            # e.g. https://auth.example.com (Dex)
  idpAudience: ""          # e.g. chat — the OIDC client id
  idpSubjectClaim: "email"
  # The base; the authz appends /mcp/<svc> for MCP paths. Served by this API
  # on api.* through a gitops route prefix.
  resourceMetadataUrl: ""  # empty → <config.apiPublicUrl>/.well-known/oauth-protected-resource
  keyCacheTtlSeconds: 300
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 64Mi }
  pdb:
    minAvailable: 1

# Istio wiring. The meshConfig extensionProvider is cluster-scoped and lives in
# gitops; see the runbook in the plan.
istio:
  enabled: false
  providerName: "alitellm-authz"
  # The Gateway the LiteLLM HTTPRoute attaches to.
  gateway:
    name: ""
    namespace: ""
  host: "api.ackstorm.ai"
  # Paths that must stay anonymous; RFC 9728 documents are fetched before a
  # client holds a token. MCP callbacks use separate HTTPRoutes.
  exemptPaths:
    - "/health"
    - "/.well-known/*"
