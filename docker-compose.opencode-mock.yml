# Standalone mock of an ackstorm.opencode-config/1 backend (fake OAuth AS +
# /clients/opencode/config + OpenAI-compatible chat) for testing the
# clients/opencode plugin (v1 and v2) and OpenWork end to end, without a real
# deployment. See docker/opencode-mock/README.md.
#
#   docker compose -f docker-compose.opencode-mock.yml up --build
#
services:
  opencode-mock:
    build:
      context: ./docker/opencode-mock
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      # Override if this is reached at a different host/port than the container
      # publishes (e.g. a reverse proxy, or testing from another machine over LAN):
      # ORIGIN: "http://<this-host>:8000"
      PROVIDER: acktest
      MODEL_ID: echo-model
      SHORT_TOKEN_SECONDS: "90"
      LONG_TOKEN_SECONDS: "3600"
