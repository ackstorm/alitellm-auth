# Local dev override: remap host ports 8080→8090 / 8081→8091 to dodge gitlab-mcp
# containers already holding 8080/8081. Issuer port matched to the new 8091.
# UI stays on http://localhost:5173/ui/ (published on the auth container).
services:
  auth:
    environment:
      OAUTH_ISSUER_URL: http://oidc.localtest.me:8091/default
    ports: !override
      - "8090:8080"
      - "5173:5173"
  mock-oidc:
    ports: !override
      - "8091:8080"
