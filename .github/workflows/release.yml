name: release
on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  release:
    # only fires on a release marker commit
    if: "${{ startsWith(github.event.head_commit.message, 'chore(release): v') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: ver
        run: |
          V=$(echo "${{ github.event.head_commit.message }}" \
            | sed -nE "s/^chore\(release\): v([0-9]+\.[0-9]+\.[0-9]+([-.A-Za-z0-9]+)?).*/\1/p")
          test -n "$V" || { echo "no version parsed"; exit 1; }
          echo "v=$V" >> "$GITHUB_OUTPUT"

      # GHCR repository paths must be lowercase (WR-02). The owner may contain
      # uppercase letters (e.g. an org named "ACKstorm"); normalize it once.
      - id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/alitellm-auth:v${{ steps.ver.outputs.v }}
            ghcr.io/${{ steps.owner.outputs.lc }}/alitellm-auth:latest

      # Idempotent tag push (WR-03). A pre-existing tag is fine (re-run of the same
      # release commit); any other failure must fail the job — no '|| true' masking.
      - run: |
          V="${{ steps.ver.outputs.v }}"
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "tag v$V already exists, skipping"
          else
            git tag -a "v$V" -m "v$V"
            git push origin "v$V"
          fi

      # Release notes for the *version-specific* CHANGELOG section (CR-02), not the
      # first '## ' block (which is the perpetual [unreleased] section). release-bump
      # promotes [unreleased] → '## [<version>] - <date>' before the release commit.
      - run: |
          V="${{ steps.ver.outputs.v }}"
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            /^## \[/ {f=0}
            f {print}
          ' CHANGELOG.md > NOTES.md
          if [ -s NOTES.md ]; then
            gh release create "v$V" --title "v$V" --notes-file NOTES.md
          else
            echo "no CHANGELOG section for v$V — falling back to auto-generated notes"
            gh release create "v$V" --title "v$V" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
