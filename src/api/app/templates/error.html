<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>alitellm-auth — Error</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #000000;
    --surface: #0b101e;
    --border:  #1e2233;
    --dim:     #4a5173;
    --text:    #c4cbe3;
    --bright:  #e8ecf7;
    --accent:  #ef4444;
    --accent2: #f87171;
    --glow:    rgba(239, 68, 68, 0.08);
    --glow2:   rgba(239, 68, 68, 0.15);
    --mono:    'JetBrains Mono', monospace;
    --sans:    'Outfit', system-ui, sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg); color: var(--text);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, var(--glow2), transparent),
      radial-gradient(circle at 80% 80%, rgba(239,68,68,0.03), transparent);
  }

  .card {
    width: 100%; max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden;
    animation: slideUp .5s ease-out;
    box-shadow: 0 0 80px -20px rgba(239,68,68,0.06);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .header { padding: 32px 32px 24px; border-bottom: 1px solid var(--border); }
  .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }

  /* Static dot (no pulse animation for errors) */
  .static-dot {
    width: 10px; height: 10px;
    background: var(--accent); border-radius: 50%;
    box-shadow: 0 0 8px var(--accent);
  }

  .status-label {
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 2px;
    color: var(--accent);
  }

  .brand-lockup { margin-bottom: 12px; }
  .brand-lockup .name { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--bright); letter-spacing: -.2px; }
  .brand-lockup .name span { color: var(--accent2); }

  .greeting { font-size: 24px; font-weight: 600; color: var(--bright); line-height: 1.3; }
  .sub { margin-top: 6px; font-size: 14px; color: var(--dim); }

  .body { padding: 24px 32px 28px; }

  .section-label {
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 2.5px;
    color: var(--dim); margin-bottom: 12px;
  }

  .error-box {
    font-family: var(--mono); font-size: 12px;
    background: var(--glow);
    border: 1px solid rgba(239,68,68,0.2);
    color: var(--accent2);
    border-radius: 6px; padding: 12px 14px;
    word-break: break-all; line-height: 1.6;
  }

  .footer {
    padding: 16px 32px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px;
  }

  .close-hint { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .close-hint a { color: var(--accent); text-decoration: none; cursor: pointer; }
  .close-hint a:hover { text-decoration: underline; }

  .lock-icon {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--dim); font-family: var(--mono); font-size: 11px;
  }
  .lock-icon svg { width: 12px; height: 12px; fill: none; stroke: var(--dim); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="status-row">
        <div class="static-dot"></div>
        <div class="status-label">Error</div>
      </div>
      <div class="brand-lockup"><div class="name">alitellm<span>-auth</span></div></div>
      <div class="greeting">Authentication failed</div>
      <div class="sub">Something went wrong during the login flow.</div>
    </div>

    <div class="body">
      <div class="section-label">Error Details</div>
      <div class="error-box">{{ error }}</div>
    </div>

    <div class="footer">
      <div>
        <div class="lock-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          no credentials stored
        </div>
        <div class="close-hint">You can safely <a onclick="window.close()">close this window</a>.</div>
      </div>
    </div>
  </div>
</body>
</html>
