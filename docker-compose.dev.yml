# Local dev stack: the WHOLE app live with a mock user and realistic data.
#
#   docker-compose -f docker-compose.dev.yml up --build
#   open http://localhost:5173/ui/
#
# Services (one user network):
#   ui            vite dev server (HMR) for src/ui      → http://localhost:5173/ui/
#   auth          the REAL FastAPI (uvicorn --reload)        → :8080 (proxied via vite /api)
#   mock-oidc     navikt/mock-oauth2-server (non-interactive) → http://localhost:8081
#   mock-litellm  tiny FastAPI stub serving repo fixtures     → :4000 (internal)
#
# OIDC dual-addressability: the issuer http://oidc.localtest.me:8081/default must
# resolve to the SAME host:port from BOTH the browser and the auth container.
#   - *.localtest.me → 127.0.0.1 via public DNS (browser/host reach published 8081)
#   - the auth container maps oidc.localtest.me → host-gateway (extra_hosts) so it
#     reaches the host's published 8081 too → discovery + token `iss` stay consistent.
# If localtest.me DNS is unavailable, add to /etc/hosts: `127.0.0.1 oidc.localtest.me`
# (see docker/README.dev.md).
#
# The `ui` service uses network_mode: service:auth so vite's hardcoded proxy target
# (localhost:8080 in src/ui/vite.config.ts) reaches the auth uvicorn unchanged —
# no frontend edit needed. Consequently the ui port 5173 is published on `auth`.

services:
  auth:
    build:
      context: ./src/api
      dockerfile: ../../docker/auth-dev.Dockerfile
    volumes:
      # Hot-reload: host app/ edits are picked up by uvicorn --reload.
      - ./src/api/app:/src/app
    environment:
      APP_BASE_URL: http://localhost:5173
      API_PUBLIC_URL: http://localhost:5173
      OAUTH_ISSUER_URL: http://oidc.localtest.me:8081/default
      OAUTH_CLIENT_ID: platform
      OAUTH_CLIENT_SECRET: dev-secret
      LITELLM_URL: http://mock-litellm:4000
      LITELLM_MASTER_KEY: sk-mock-master
      SESSION_SECRET_KEY: dev-session-secret-change-me-0123456789abcdef
      SESSION_HTTPS_ONLY: "false"
      AS_SIGNING_KEY_PEM: |-
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAooWM8tDQuarT7TUDyin9
        lSI/S9eWrSKdnQuHfPOxTdhZqlzZrpRDWzDSJmhsRzcmJ9nlXJVQJDGA7SULTLOK
        iPkdUI3xXVZWccmc7mdS8ggrSkNRG77+DaGZSw9o5hU8zJd3OaI8M1v8fJ6hcM1z
        UK7EiUmuLcpsLpMXwxjdjrUcxFTf0qchNNWv/PZL9d8f+3j5tDOxvlmI5TRrktWY
        uRpdP3CgmTgm1/pT63etOpymOdyz/t2L8dZErJ42OvP6oJK0k/HcPQPOzbGfmwlm
        Pa3ZUxn7dBNDw4J8pn+c/cVdfz0GdeKF280UlMx/p02iTFJUsYXRq0t7ekd2DrOR
        rQIDAQAB
        -----END PUBLIC KEY-----
      AS_KEY_ENCRYPTION_KEY: QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
      AS_REDIS_URL: memory://
      INTERNAL_TOKEN: dev-internal-token
    extra_hosts:
      # Make oidc.localtest.me resolve to the host inside the container so the
      # server-side discovery/token fetch hits the same published mock-oidc the
      # browser does (identical iss).
      - "oidc.localtest.me:host-gateway"
    ports:
      - "8080:8080"
      # 5173 is published HERE because `ui` shares this container's net namespace.
      - "5173:5173"
    depends_on:
      mock-oidc:
        condition: service_started
      mock-litellm:
        condition: service_started

  ui:
    image: node:22-slim
    working_dir: /app
    # Share the auth container's network namespace so vite's proxy target
    # (localhost:8080) hits the auth uvicorn, with zero changes to vite.config.ts.
    network_mode: "service:auth"
    volumes:
      - ./src/ui:/app
      # Anonymous volume keeps the container's installed node_modules from being
      # clobbered by the host bind-mount.
      - /app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - auth

  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "8081:8080"
    volumes:
      - ./docker/mock-oidc/config.json:/app/config.json:ro
    environment:
      JSON_CONFIG_PATH: /app/config.json

  mock-litellm:
    build:
      context: ./docker/mock-litellm
      dockerfile: Dockerfile
    volumes:
      # Reuse the repo's LiteLLM response fixtures as canned data (read-only).
      - ./src/api/tests/fixtures:/app/repo-fixtures:ro
      # Live-mount the stub + its fixtures so edits don't need an image rebuild:
      # `docker compose -f docker-compose.dev.yml restart mock-litellm` re-imports
      # them in ~1s. (The image still bakes copies for non-compose use.)
      - ./docker/mock-litellm/app.py:/app/app.py:ro
      - ./docker/mock-litellm/fixtures:/app/fixtures:ro
    # --reload picks up app.py edits automatically; fixture JSON is loaded at
    # import, so a `restart` applies those.
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "4000", "--reload"]
    ports:
      - "4000:4000"
